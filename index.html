
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f7f2">
<title>Mindra — A space for your mind</title>
<style>
:root {
  --bg: #f7f7f2;
  --panel: #ffffff;
  --ink: #253d36;
  --muted: #77847d;
  --accent: #527b69;
  --soft: #e8eee7;
  --line: #e7e9e2;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
}
.app {
  height: 100dvh;
  min-height: 440px;
  display: flex;
  flex-direction: column;
  max-width: 1000px;
  margin: auto;
}
header {
  height: 66px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: rgba(247,247,242,.94);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -.8px;
}
.logo {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--accent);
  color: white;
  font-size: 21px;
}
.status {
  color: var(--muted);
  font-size: 12px;
}
main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.welcome {
  margin: auto auto 18px;
  padding: 24px 22px 0;
  width: 100%;
  max-width: 620px;
  text-align: center;
}
.orb {
  width: 64px;
  height: 64px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,
    #dce8d9, #a9c6b2 55%, #668a77);
  box-shadow: 0 8px 30px #527b6920;
}
h1 {
  margin: 0 0 12px;
  font-size: clamp(27px, 6vw, 38px);
  letter-spacing: -1.6px;
  font-weight: 550;
}
.subtitle {
  margin: 0 auto;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
  max-width: 400px;
}
.suggestions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 23px;
}
.suggestion {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 11px 13px;
  border-radius: 18px;
  font-size: 12px;
  cursor: pointer;
}
.suggestion:active { background: var(--soft); }
#messages {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  scrollbar-width: thin;
}
.message {
  margin: 0 0 20px;
  line-height: 1.7;
  font-size: 15px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.message.user {
  margin-left: auto;
  max-width: 86%;
  width: fit-content;
  background: var(--soft);
  padding: 12px 16px;
  border-radius: 18px 18px 5px 18px;
}
.message.assistant { padding: 4px 2px; }
.label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
  letter-spacing: .4px;
}
.composer-area {
  padding: 12px 16px 8px;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
}
.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 8px 9px 8px 17px;
  border: 1px solid #dfe3da;
  background: white;
  border-radius: 25px;
  box-shadow: 0 5px 24px #263d3510;
}
textarea {
  flex: 1;
  min-width: 0;
  max-height: 120px;
  resize: none;
  border: 0;
  outline: none;
  padding: 9px 0;
  background: transparent;
  font: inherit;
  color: var(--ink);
  font-size: 15px;
}
textarea::placeholder { color: #98a29b; }
#send {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: 21px;
  cursor: pointer;
}
#send:disabled { opacity: .45; }
.disclaimer {
  padding: 9px 8px 10px;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.6;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  padding: 0 12px 10px;
}
@media (max-width: 480px) {
  header { padding: 0 15px; height: 58px; }
  .brand { font-size: 19px; }
  .welcome { padding-left: 17px; padding-right: 17px; }
  .suggestions { gap: 7px; }
  .suggestion { padding: 10px 11px; }
  .composer-area { padding: 8px 11px 5px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">m</div>
      Mindra
    </div>
    <div class="status">A space for your mind</div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <div class="orb"></div>
      <h1>What's on your mind?</h1>
      <p class="subtitle">
        A quiet space to pause, reflect, and make sense
        of what you're feeling. Start wherever you are.
      </p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="I've had a difficult day.">
          A difficult day
        </button>
        <button class="suggestion" data-prompt="I feel overwhelmed and need to talk.">
          Feeling overwhelmed
        </button>
        <button class="suggestion" data-prompt="Help me understand my feelings.">
          Understand my feelings
        </button>
      </div>
    </section>

    <section id="messages" aria-live="polite"></section>
  </main>

  <section class="composer-area">
    <form class="composer" id="chatForm">
      <textarea id="input" rows="1"
        placeholder="Share what's on your mind..."
        aria-label="Your message"></textarea>
      <button id="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <div class="disclaimer">
      Mindra offers reflective wellness support, not medical care
      or a replacement for a qualified professional.
    </div>
  </section>
  <footer>Take a breath. There's no rush.</footer>
</div>

<script>
const welcome = document.getElementById("welcome");
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const form = document.getElementById("chatForm");
const send = document.getElementById("send");

function addMessage(text, role) {
  const item = document.createElement("div");
  item.className = "message " + role;

  if (role === "assistant") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "MINDRA · DEMO";
    item.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  item.appendChild(content);
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}

function demoReply(text) {
  const t = text.toLowerCase();

  if (/suicid|kill myself|end my life|hurt myself/.test(t)) {
    return "I'm sorry things feel so difficult right now. Your safety matters. If you may be in immediate danger, please contact local emergency services and reach out to a trusted person who can stay with you. You deserve support from a real person, too.";
  }

  if (/overwhelm|stress|anxious|anxiety|panic/.test(t)) {
    return "That sounds like a lot to carry. Let's slow things down for a moment. If it feels comfortable, take a gentle breath and focus on just one thing at a time. What's been weighing on you most today?";
  }

  if (/sad|lonely|alone|difficult day|upset/.test(t)) {
    return "I'm glad you put those feelings into words. You don't have to make sense of everything immediately. What happened today that has been hardest for you?";
  }

  return "Thank you for sharing that with me. Let's take it one step at a time, without judging what you're feeling. Can you tell me a little more about what's been on your mind?";
}

function submitMessage(text) {
  text = text.trim();
  if (!text) return;

  welcome.style.display = "none";
  messages.style.display = "block";
  addMessage(text, "user");
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;

  setTimeout(() => {
    addMessage(demoReply(text), "assistant");
    send.disabled = false;
    input.focus();
  }, 450);
}

form.addEventListener("submit", event => {
  event.preventDefault();
  submitMessage(input.value);
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    submitMessage(button.dataset.prompt);
  });
});
</script>
</body>
  </html>
